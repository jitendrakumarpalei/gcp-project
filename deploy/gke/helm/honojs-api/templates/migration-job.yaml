{{- if .Values.runMigrations }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-migrations-{{ .Release.Revision }}
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-migration
    spec:
      restartPolicy: Never
      containers:
      - name: migration-runner
        image: jitendrapalei/control-plane-service:latest
        imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Running database migrations..."

            echo "Running control-plane migrations..."
            # Run Knex CLI via node (no tsx required)
            node ./node_modules/knex/bin/cli.js --knexfile apps/control-plane/knexfile.ts migrate:latest

            echo "Running ledger migrations..."
            node ./node_modules/knex/bin/cli.js --knexfile apps/ledger/knexfile.ts migrate:latest

            echo "Migrations completed successfully!"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: database_url
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
{{- end }}